[package]
name = "kwnote"
version = "0.2.0"
description = "kwnote — spaced-repetition memory notes (CLI / TUI / LAN sync server)"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
flate2 = "1.1.10"
getrandom = "0.4.3"
qrcode = { version = "0.14.1", default-features = false }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"
unicode-width = "0.2.2"
ureq = { version = "3.4.2", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
